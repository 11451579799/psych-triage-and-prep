name: Update knowledge base

on:
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sharded knowledge base
        run: python scripts/build_1mb_kb.py --delay 0.5

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references/openfda-drugs references/kb-index.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore(kb): refresh OpenFDA/PubChem shards"
            git push
          fi
